name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install（校验依赖可解析）
        run: npm install --ignore-scripts
      - name: node --check 所有后端 JS
        run: |
          fail=0
          for f in panel/*.js agent/*.js scripts/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail
      - name: Agent 产物新鲜度（改了 agent/src 忘了 build:agent 会被拦下）
        run: node agent/build.js --check
      - name: Agent 测试（零依赖，不需要面板与真实服务器）
        run: npm run test:agent
      # 找回密码的端到端测试**刻意不放进 test:agent**：它要反复等限流冷却，
      # 单跑约 10 分钟，塞进主的链会让本地与 CI 都快不起来。
      # 但它必须**在 CI 里跑**——它覆盖 /forgot-password 与 /verify-reset-code
      # 的完整状态机，此前因为没接入而长期无人执行（改这两条路径时不会被拦下）。
      - name: 找回密码端到端测试（独立步骤，约 10 分钟）
        run: npm run test:e2e

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
        working-directory: web
      - name: Lint
        run: npx oxlint
        working-directory: web
      - name: 单元测试
        run: npm test
        working-directory: web
      - name: 构建
        run: npm run build
        working-directory: web
