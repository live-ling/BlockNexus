name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install（校验依赖可解析）
        run: npm install --ignore-scripts
      - name: node --check 所有后端 JS
        run: |
          fail=0
          for f in panel/*.js agent/*.js scripts/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
        working-directory: web
      - name: 构建
        run: npm run build
        working-directory: web
